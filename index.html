<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jericho Elite Performance OS</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jericho">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#0a0a0a;
    --panel:#141414;
    --panel-2:#1c1c1c;
    --line:#2c2c2c;
    --paper:#eee9e0;
    --paper-dim:#9c9686;
    --gold:#b6924a;
    --gold-soft:#d9b876;
    --gold-glow:rgba(182,146,74,.35);
    --mono:'Courier New',ui-monospace,monospace;
    --ease:cubic-bezier(.22,.9,.32,1);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--ink);color:var(--paper);font-family:var(--mono);
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  }
  body{
    background:
      radial-gradient(ellipse 900px 520px at 50% -8%, rgba(182,146,74,.10), transparent 62%),
      radial-gradient(ellipse 700px 700px at 100% 100%, rgba(182,146,74,.05), transparent 55%),
      var(--ink);
  }
  /* trama sutil de líneas */
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, transparent 0, transparent 47px, rgba(255,255,255,.018) 48px);
  }

  .os{
    position:relative;min-height:100%;
    display:flex;flex-direction:column;
    width:min(760px,100%);margin:0 auto;
    padding:calc(22px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }

  /* ---------- CABECERA ---------- */
  .head{flex:0 0 auto;padding-bottom:16px;border-bottom:1px solid var(--line);position:relative;animation:rise .6s var(--ease) backwards;}
  .head::after{
    content:'';position:absolute;left:0;bottom:-1px;width:64px;height:1px;background:var(--gold);
    box-shadow:0 0 12px var(--gold-glow);
  }
  .kicker{font-size:9px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;margin-bottom:12px;}
  .brand{
    margin:0;font-size:clamp(40px,13vw,76px);font-weight:700;letter-spacing:.14em;line-height:.9;text-transform:uppercase;
    background:linear-gradient(180deg,var(--paper) 30%,#b9b2a0);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-sub{
    margin:10px 0 0;font-size:clamp(10px,2.9vw,13px);letter-spacing:.34em;color:var(--paper-dim);text-transform:uppercase;
  }
  .brand-sub b{color:var(--gold);font-weight:700;}

  /* ---------- MÓDULOS ---------- */
  .grid{
    flex:1 1 auto;min-height:0;margin:16px 0 0;
    display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:10px;
  }
  .mod{
    position:relative;display:flex;flex-direction:column;justify-content:space-between;
    min-height:150px;padding:14px 14px 13px;
    text-decoration:none;color:inherit;text-align:left;
    border:1px solid var(--line);
    background:linear-gradient(165deg,#1b1b1b,var(--panel));
    overflow:hidden;
    animation:rise .55s var(--ease) backwards;
    transition:transform .3s var(--ease),border-color .3s ease,box-shadow .3s var(--ease);
  }
  .mod:nth-child(1){animation-delay:.10s}
  .mod:nth-child(2){animation-delay:.16s}
  .mod:nth-child(3){animation-delay:.22s}
  .mod:nth-child(4){animation-delay:.28s}
  .mod::before{ /* filo dorado superior */
    content:'';position:absolute;left:0;top:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--gold),transparent 70%);opacity:.55;transition:opacity .3s ease;
  }

  .mod-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .mod-num{font-size:9px;letter-spacing:.22em;color:var(--gold);}
  .mod-ico{width:clamp(34px,10vw,46px);height:clamp(34px,10vw,46px);stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease),stroke .3s ease;}
  .mod-ico .fill{fill:var(--gold);stroke:none;}

  .mod-body{margin-top:auto;}
  .mod-name{
    margin:0;font-size:clamp(13px,4vw,17px);font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.2;
  }
  .mod-name span{display:block;}
  .mod-state{
    margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-dim);
  }
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;background:var(--paper-dim);vertical-align:middle;opacity:.5;}
  .arrow{font-size:16px;color:var(--gold);display:inline-block;transition:transform .3s var(--ease);}

  /* módulo activo */
  .mod.on{border-color:#3d3322;cursor:pointer;}
  .mod.on .mod-state{color:var(--paper);}
  .mod.on .dot{background:var(--gold);opacity:1;box-shadow:0 0 8px 1px var(--gold-glow);animation:live 1.8s ease-in-out infinite;}
  .mod.on::after{ /* resplandor interior */
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 80% 60% at 20% 0%, rgba(182,146,74,.12), transparent 70%);
  }
  @media (hover:hover){
    .mod.on:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 18px 38px -16px rgba(0,0,0,.75),0 0 34px -14px var(--gold-glow);}
    .mod.on:hover::before{opacity:1;}
    .mod.on:hover .arrow{transform:translateX(5px);}
    .mod.on:hover .mod-ico{transform:scale(1.08);}
  }
  .mod.on:active{transform:scale(.985);}
  .mod.on:focus-visible{outline:1px solid var(--gold);outline-offset:3px;}

  /* módulos próximos */
  .mod.soon{border-style:dashed;cursor:default;background:linear-gradient(165deg,#151515,#101010);}
  .mod.soon::before{opacity:.18;}
  .mod.soon .mod-ico{stroke:#5d594f;}
  .mod.soon .mod-num{color:#6f6452;}
  .mod.soon .mod-name{color:#7d786b;}

  /* ---------- PIE ---------- */
  .foot{
    flex:0 0 auto;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:10px;
    font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim);
    animation:rise .6s var(--ease) .38s backwards;
  }
  .foot b{color:var(--paper);font-weight:700;}

  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes live{0%,100%{opacity:1;}50%{opacity:.3;}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}

  /* pantallas bajas: dejar scrollear en vez de aplastar */
  @media (max-height:640px){.grid{grid-auto-rows:minmax(150px,1fr);}}
</style>
</head>
<body>

<main class="os">

  <header class="head">
    <div class="kicker">Sistema de análisis de combate</div>
    <h1 class="brand">Jericho</h1>
    <p class="brand-sub"><b>Elite</b> Performance OS</p>
  </header>

  <nav class="grid" aria-label="Herramientas">

    <a class="mod on" href="strike.html">
      <div class="mod-top">
        <span class="mod-num">01</span>
        <svg class="mod-ico" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="18"/><circle cx="24" cy="24" r="9"/>
          <circle class="fill" cx="24" cy="24" r="2.4"/>
          <path d="M24 2v7M24 39v7M2 24h7M39 24h7"/>
        </svg>
      </div>
      <div class="mod-body">
        <h2 class="mod-name"><span>Strike</span><span>Analyzer</span></h2>
        <div class="mod-state"><span><i class="dot"></i>Activo</span><span class="arrow">→</span></div>
      </div>
    </a>

    <div class="mod soon" aria-disabled="true">
      <div class="mod-top">
        <span class="mod-num">02</span>
        <svg class="mod-ico" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 5l16 6v13c0 9-7 16-16 19C15 40 8 33 8 24V11z"/>
          <path d="M24 5v38"/>
        </svg>
      </div>
      <div class="mod-body">
        <h2 class="mod-name"><span>Defense</span><span>Analyzer</span></h2>
        <div class="mod-state"><span><i class="dot"></i>Próximamente</span></div>
      </div>
    </div>

    <div class="mod soon" aria-disabled="true">
      <div class="mod-top">
        <span class="mod-num">03</span>
        <svg class="mod-ico" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="6" y="6" width="36" height="36"/>
          <rect x="14" y="14" width="20" height="20"/>
          <path d="M6 6l8 8M42 6l-8 8M6 42l8-8M42 42l-8-8"/>
        </svg>
      </div>
      <div class="mod-body">
        <h2 class="mod-name"><span>Ring</span><span>Map</span></h2>
        <div class="mod-state"><span><i class="dot"></i>Próximamente</span></div>
      </div>
    </div>

    <div class="mod soon" aria-disabled="true">
      <div class="mod-top">
        <span class="mod-num">04</span>
        <svg class="mod-ico" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="18" cy="24" r="12"/><circle cx="30" cy="24" r="12"/>
        </svg>
      </div>
      <div class="mod-body">
        <h2 class="mod-name"><span>Guard / Position</span><span>Analyzer</span></h2>
        <div class="mod-state"><span><i class="dot"></i>Próximamente</span></div>
      </div>
    </div>

  </nav>

  <footer class="foot">
    <span><b>1</b> de 4 módulos activos</span>
    <span>Elegí una herramienta</span>
  </footer>

</main>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
